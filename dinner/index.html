@font-face { font-family: "Big Shoulders"; src: url("../assets/fonts/big-shoulders-latin-var.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }

:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }

/* Layout: a phone-first diner app. A sticky sign-style header, one column of order tickets and cards,
   and a fixed tab bar on phones; on wide screens the tabs move into the header and screens split into two columns. */
:root {
  --bg: #EDF0EA;            /* countertop formica, cool sage-gray */
  --surface: #FFFFFF;
  --surface-2: #F5F7F2;
  --ink: #1B2420;
  --ink-2: #4C5852;
  --ink-3: #65716A;
  --line: #D2DAD2;
  --line-strong: #B4C0B7;
  --ticket: #E5F0E0;        /* guest-check paper */
  --ticket-rule: #A7C9AF;
  --ticket-ink: #285F43;
  --ketchup: #B93427;       /* primary action */
  --ketchup-press: #9C2A1F;
  --on-ketchup: #FFFFFF;
  --mustard: #E2A11B;
  --mustard-ink: #7A5200;
  --mustard-wash: #FBEFCF;
  --relish: #3A7642;        /* cheap, done, good */
  --relish-wash: #E2EFDF;
  --scrim: rgba(12, 18, 14, .52);
  --c-chicken: #D99A1E;
  --c-beef: #8C2B36;
  --c-pork: #C9606A;
  --c-seafood: #276C9C;
  --c-meatless: #3A7642;
  --shadow-1: 0 1px 2px rgba(27, 36, 32, .06), 0 8px 22px -12px rgba(27, 36, 32, .30);
  --shadow-2: 0 2px 6px rgba(27, 36, 32, .10), 0 24px 48px -18px rgba(27, 36, 32, .45);

  --font-sign: "Big Shoulders", "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  --r-1: 6px;
  --r-2: 10px;
  --r-3: 16px;
  --tabbar-h: 62px;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101512; --surface: #171D19; --surface-2: #1D241F; --ink: #E8EDE6; --ink-2: #A9B5AD; --ink-3: #85928A;
    --line: #2A332D; --line-strong: #3C4840; --ticket: #17231B; --ticket-rule: #31503B; --ticket-ink: #8DCDA4;
    --ketchup: #E2574A; --ketchup-press: #EC6E62; --on-ketchup: #1B0A07; --mustard: #F0B442; --mustard-ink: #F3C66A;
    --mustard-wash: #3A2F12; --relish: #74BE80; --relish-wash: #1D2E20; --scrim: rgba(0, 0, 0, .62);
    --c-chicken: #E7B34A; --c-beef: #E9808C; --c-pork: #EE9AA2; --c-seafood: #74B5E2; --c-meatless: #74BE80;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 26px -12px rgba(0, 0, 0, .7);
    --shadow-2: 0 2px 8px rgba(0, 0, 0, .5), 0 26px 52px -18px rgba(0, 0, 0, .85);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101512; --surface: #171D19; --surface-2: #1D241F; --ink: #E8EDE6; --ink-2: #A9B5AD; --ink-3: #85928A;
  --line: #2A332D; --line-strong: #3C4840; --ticket: #17231B; --ticket-rule: #31503B; --ticket-ink: #8DCDA4;
  --ketchup: #E2574A; --ketchup-press: #EC6E62; --on-ketchup: #1B0A07; --mustard: #F0B442; --mustard-ink: #F3C66A;
  --mustard-wash: #3A2F12; --relish: #74BE80; --relish-wash: #1D2E20; --scrim: rgba(0, 0, 0, .62);
  --c-chicken: #E7B34A; --c-beef: #E9808C; --c-pork: #EE9AA2; --c-seafood: #74B5E2; --c-meatless: #74BE80;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 26px -12px rgba(0, 0, 0, .7);
  --shadow-2: 0 2px 8px rgba(0, 0, 0, .5), 0 26px 52px -18px rgba(0, 0, 0, .85);
  color-scheme: dark;
}

/* ---------- base ---------- */
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html.locked, html.locked body { overflow: hidden; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; border-radius: 4px; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.ic.fill { fill: currentColor; }
.sign { font-family: var(--font-sign); font-weight: 800; line-height: .95; letter-spacing: .005em; font-variation-settings: "opsz" 72; text-wrap: balance; }
.muted { color: var(--ink-2); }
.num { font-variant-numeric: tabular-nums; }
.fr { font-size: .78em; letter-spacing: .02em; }
.fr sup, .fr sub { font-size: 1em; line-height: 0; position: relative; vertical-align: baseline; }
.fr sup { top: -.38em; }
.fr sub { top: .06em; }

.wrap {
  max-width: 1160px;
  margin: 0 auto;
  padding-left: var(--gut-l);
  padding-right: var(--gut-r);
}

/* ---------- header ---------- */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.top-in { display: flex; align-items: center; gap: 16px; min-height: 58px; padding-block: 8px; }
.brand {
  display: inline-flex; align-items: baseline; gap: .28em; text-decoration: none;
  font-family: var(--font-sign); font-weight: 900; text-transform: uppercase; letter-spacing: .035em;
  font-size: 25px; line-height: 1; font-variation-settings: "opsz" 72; white-space: nowrap;
}
.brand-a { color: var(--ink); }
.brand-b { color: var(--ketchup); }
.brand-dot { width: .42em; height: .42em; border-radius: 50%; background: var(--mustard); transform: translateY(-.08em); }
.top-tabs { display: none; }
.chef-btn {
  margin-left: auto; display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px;
  border-radius: 999px; border: 1.5px solid var(--ink); font-weight: 700; font-size: 15px;
}
.chef-btn:hover { background: var(--surface); }
.chef-btn .ic { width: 22px; height: 22px; }
@media (max-width: 430px) {
  .brand { font-size: 22px; }
  .chef-btn { padding: 0 10px; }
  .chef-btn span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
}

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-left: var(--gut-l); padding-right: var(--gut-r); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar-in { display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabbar-h); max-width: 560px; margin: 0 auto; }
.tab {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 12px; font-weight: 700; color: var(--ink-3); letter-spacing: .01em; min-width: 0;
}
.tab .ic { width: 23px; height: 23px; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"]::before {
  content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--ketchup);
}
.tab-badge {
  position: absolute; top: 7px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--ketchup); color: var(--on-ketchup); font-size: 11px; line-height: 18px; text-align: center;
}

main { padding-block: 20px calc(var(--tabbar-h) + 40px + env(safe-area-inset-bottom, 0px)); }
.screen { animation: fade .22s ease both; }
@keyframes fade { from { opacity: .4; } to { opacity: 1; } }

@media (min-width: 1024px) {
  .top-in { min-height: 68px; gap: 28px; }
  .brand { font-size: 30px; }
  .top-tabs { display: flex; gap: 4px; }
  .top-tabs .tab { flex-direction: row; gap: 8px; font-size: 15px; padding: 0 14px; height: 42px; border-radius: 999px; color: var(--ink-2); }
  .top-tabs .tab .ic { width: 20px; height: 20px; }
  .top-tabs .tab:hover { color: var(--ink); background: var(--surface); }
  .top-tabs .tab[aria-current="page"] { background: var(--ink); color: var(--bg); }
  .top-tabs .tab[aria-current="page"]::before { display: none; }
  .top-tabs .tab-badge { position: static; margin-left: -2px; }
  .tabbar { display: none; }
  main { padding-block: 32px 64px; }
}

/* ---------- shared bits ---------- */
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); }
.scr-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; margin-bottom: 18px; }
.scr-head h1 { font-family: var(--font-sign); font-weight: 800; font-size: clamp(34px, 7vw, 46px); line-height: .95; letter-spacing: .005em; font-variation-settings: "opsz" 72; }
.scr-head p { margin-top: 6px; color: var(--ink-2); max-width: 60ch; }
.scr-head > div { min-width: 0; }
.sec-h { font-family: var(--font-sign); font-weight: 800; font-size: 25px; line-height: 1; letter-spacing: .01em; font-variation-settings: "opsz" 72; margin-bottom: 12px; }
.fineprint { font-size: 13px; color: var(--ink-3); max-width: 70ch; margin-top: 18px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px;
  border-radius: var(--r-1); font-weight: 700; font-size: 16px; line-height: 1.1; text-align: center;
  transition: background-color .15s, transform .08s, border-color .15s;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--ketchup); color: var(--on-ketchup); }
.btn-primary:hover { background: var(--ketchup-press); }
.btn-line { border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink); }
.btn-line:hover { border-color: var(--ink); }
.btn-line[aria-pressed="true"] { border-color: var(--ketchup); color: var(--ketchup); }
.btn-quiet { min-height: 40px; padding: 0 12px; color: var(--ink-2); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.btn-quiet:hover { color: var(--ink); }
.btn.sm { min-height: 38px; padding: 0 12px; font-size: 14px; }
.btn.lg { min-height: 56px; font-size: 18px; padding: 0 22px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn-icon {
  display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; color: var(--ink-2); flex: none;
}
.btn-icon:hover { background: var(--surface-2); color: var(--ink); }
.btn-icon[aria-pressed="true"] { color: var(--ketchup); }
.btn-icon[aria-pressed="true"] .ic, .btn-line[aria-pressed="true"] .ic { fill: currentColor; }

.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 14px; border-radius: 999px;
  border: 1.5px solid var(--line-strong); background: var(--surface); font-size: 15px; font-weight: 600; color: var(--ink);
  white-space: nowrap; transition: background-color .12s, border-color .12s;
}
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"], .chip[aria-checked="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip .ic { width: 16px; height: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 18px; scrollbar-width: thin; }
.chip-row .chip { flex: none; }

.seg { display: inline-flex; flex-wrap: wrap; border: 1.5px solid var(--line-strong); border-radius: var(--r-1); background: var(--surface); overflow: hidden; }
.seg button { min-height: 38px; padding: 0 12px; font-size: 14.5px; font-weight: 700; color: var(--ink-2); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-checked="true"] { background: var(--ink); color: var(--bg); }

.ptag {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2);
}
.ptag::before { content: ""; width: 9px; height: 9px; border-radius: 2px; background: var(--pc, var(--ink-3)); flex: none; }
.p-chicken { --pc: var(--c-chicken); }
.p-beef { --pc: var(--c-beef); }
.p-pork { --pc: var(--c-pork); }
.p-seafood { --pc: var(--c-seafood); }
.p-meatless { --pc: var(--c-meatless); }

.price {
  display: inline-flex; align-items: center; gap: 0; font-size: 13px; font-weight: 800; padding: 3px 8px; border-radius: 999px;
  background: var(--surface-2); color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.price.cheap { background: var(--relish-wash); color: var(--relish); }
.price.splurge { background: var(--mustard-wash); color: var(--mustard-ink); }

.stepper { display: inline-flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 700; color: var(--ink-2); }
.stepper .lbl { margin-right: 6px; }
.stepper button { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; background: var(--surface); color: var(--ink); }
.stepper button:hover { border-color: var(--ink); }
.stepper button .ic { width: 16px; height: 16px; }
.stepper output { min-width: 2ch; text-align: center; font-size: 18px; color: var(--ink); font-variant-numeric: tabular-nums; }

.searchbox { position: relative; }
.searchbox .ic { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.searchbox input {
  width: 100%; min-height: 46px; padding: 0 14px 0 42px; border-radius: var(--r-1); border: 1.5px solid var(--line-strong);
  background: var(--surface); font-size: 16px;
}
.searchbox input:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 18%, transparent); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-2); padding: 18px; }
.empty { border: 1.5px dashed var(--line-strong); border-radius: var(--r-2); padding: 22px 18px; color: var(--ink-2); background: var(--surface-2); }
.empty b { color: var(--ink); }

/* ---------- tonight ---------- */
.greet { margin-bottom: 22px; }
.greet h1 { font-family: var(--font-sign); font-weight: 800; font-size: clamp(30px, 6.4vw, 44px); line-height: .98; margin-top: 6px; max-width: 18ch; text-wrap: balance; font-variation-settings: "opsz" 72; }
.greet .greet-sub { margin-top: 8px; color: var(--ink-2); font-size: 17px; }
.tonight-grid { display: grid; gap: 28px; }
.tonight-side { display: grid; gap: 28px; align-content: start; min-width: 0; }
@media (min-width: 1024px) {
  .tonight-grid { grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr); gap: 36px; align-items: start; }
}

.ticket {
  position: relative; background: var(--ticket); color: var(--ink); border-radius: 0 0 var(--r-2) var(--r-2);
  padding: 26px 22px 22px; box-shadow: var(--shadow-1); margin-top: 6px;
}
.ticket::before {
  content: ""; position: absolute; left: 0; right: 0; top: -6px; height: 12px;
  background: radial-gradient(circle at 9px 6px, var(--bg) 5.5px, transparent 6px) repeat-x;
  background-size: 18px 12px;
}
.ticket.printing { animation: print .42s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes print {
  from { clip-path: inset(0 0 100% 0); transform: translateY(-10px); }
  to { clip-path: inset(0 0 0 0); transform: none; }
}
.tk-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 10px; border-bottom: 2px solid var(--ticket-rule); }
.tk-label { font-size: 13px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--ticket-ink); }
.tk-no { font-family: var(--font-sign); font-weight: 800; font-size: 22px; color: var(--ketchup); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.tk-cells { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid var(--ticket-rule); }
.tk-cells > div { padding: 8px 10px 9px; border-right: 1px solid var(--ticket-rule); min-width: 0; }
.tk-cells > div:first-child { padding-left: 0; }
.tk-cells > div:last-child { border-right: 0; }
.tk-cells span { display: block; font-size: 11.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ticket-ink); }
.tk-cells b { display: block; font-family: var(--font-sign); font-size: 24px; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tk-cat { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 16px; }
.tk-cat .tk-tags { font-size: 14px; color: var(--ink-2); }
.tk-title { font-family: var(--font-sign); font-weight: 800; font-size: clamp(38px, 9vw, 58px); line-height: .92; margin-top: 8px; text-wrap: balance; font-variation-settings: "opsz" 72; overflow-wrap: anywhere; }
.tk-blurb { margin-top: 12px; font-size: 18px; line-height: 1.45; max-width: 46ch; }
.tk-lines { margin-top: 18px; border-top: 1px solid var(--ticket-rule); }
.tk-lines li { display: grid; grid-template-columns: 5.4em minmax(0, 1fr); gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--ticket-rule); font-size: 15.5px; }
.tk-lines .q { color: var(--ticket-ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.tk-lines .more { display: block; color: var(--ink-2); font-size: 14.5px; }
.tk-total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 0 2px; border-bottom: 3px double var(--ticket-rule); }
.tk-total span { font-size: 13px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ticket-ink); }
.tk-total b { font-family: var(--font-sign); font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; }
.tk-warn { margin-top: 14px; padding: 10px 12px; border-radius: var(--r-1); background: var(--mustard-wash); color: var(--mustard-ink); font-size: 15px; font-weight: 600; }
.tk-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; align-items: center; }
.tk-actions .btn-primary { flex: 1 1 180px; min-height: 52px; font-size: 17px; }
.tk-actions .btn-line { flex: 1 1 140px; }
.tk-actions .btn-icon { border: 1.5px solid var(--line-strong); background: var(--surface); border-radius: var(--r-1); width: 52px; height: 52px; }
.tk-foot { margin-top: 14px; font-size: 14px; color: var(--ink-2); }
.tk-foot button { font-weight: 700; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

.ctrl { display: grid; gap: 8px; margin-top: 16px; }
.ctrl:first-of-type { margin-top: 12px; }
.ctrl-l { font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.panel-h { font-family: var(--font-sign); font-weight: 800; font-size: 24px; line-height: 1; font-variation-settings: "opsz" 72; }
.flt-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }

.mini-list { display: grid; gap: 10px; }

  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; width: 100%; text-align: left;
  padding: 14px 16px; border-radius: var(--r-2); background: var(--surface); border: 1px solid var(--line); transition: border-color .12s, transform .12s;
}

.callout { padding: 18px; border-radius: var(--r-2); background: var(--surface-2); border: 1px solid var(--line); display: grid; gap: 8px; justify-items: start; }

.callout p { color: var(--ink-2); }

/* ---------- fridge ---------- */
.ai-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
.scan { display: flex; gap: 14px; align-items: center; padding: 12px; border-radius: var(--r-2); background: var(--surface); border: 1px solid var(--line); margin-bottom: 16px; }
.scan img { width: 64px; height: 64px; object-fit: cover; border-radius: var(--r-1); flex: none; max-width: 100%; }
.scan p { font-size: 15px; }
.scan .scan-other { color: var(--ink-2); font-size: 14px; margin-top: 2px; }
.fridge-grid { display: grid; gap: 28px; }
.fridge-pick { min-width: 0; }
.picked-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 14px 0 6px; font-weight: 700; }
.cg { padding: 16px 0; border-bottom: 1px solid var(--line); }
.cg:last-child { border-bottom: 0; }
.cg-h { font-size: 13px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 10px; }
.cg .more { margin-top: 10px; }
.fridge-results { min-width: 0; }
.match-list { display: grid; gap: 10px; }
.match {
  display: grid; gap: 6px; width: 100%; text-align: left; padding: 14px 16px; border-radius: var(--r-2); background: var(--surface);
  border: 1px solid var(--line); transition: border-color .12s;
}
.match:hover { border-color: var(--ink); }
.match .m-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.match .m-name { font-family: var(--font-sign); font-weight: 800; font-size: 24px; line-height: 1; font-variation-settings: "opsz" 72; }
.meter { height: 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--relish); border-radius: 4px; }
.match .m-have { font-size: 14.5px; font-weight: 700; }
.match .m-need { font-size: 14.5px; color: var(--ink-2); }
.match .m-ready { font-size: 14.5px; font-weight: 700; color: var(--relish); }
.jump {
  position: fixed; z-index: 25; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--tabbar-h) + 14px + env(safe-area-inset-bottom, 0px));
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px;
  background: var(--ink); color: var(--bg); font-weight: 700; text-decoration: none; box-shadow: var(--shadow-2); white-space: nowrap;
}
@media (min-width: 1024px) {
  .fridge-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; align-items: start; }
  .fridge-results { position: sticky; top: calc(84px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 110px); overflow: auto; padding-right: 4px; }
  .jump { display: none; }
}

/* ---------- week ---------- */
.week-sum { display: grid; gap: 14px; padding: 16px 18px; border-radius: var(--r-2); background: var(--surface); border: 1px solid var(--line); margin-bottom: 14px; }
.ws-cost { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.ws-cost .l { font-size: 13px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); width: 100%; }
.ws-cost b { font-family: var(--font-sign); font-weight: 800; font-size: 44px; line-height: .9; font-variant-numeric: tabular-nums; }
.ws-cost .per { color: var(--ink-2); font-weight: 600; }
.ws-actions { display: flex; flex-wrap: wrap; gap: 8px; }
@media (min-width: 760px) {
  .week-sum { grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
}
.banner { padding: 12px 14px; border-radius: var(--r-1); background: var(--mustard-wash); color: var(--mustard-ink); font-size: 15px; font-weight: 600; margin-bottom: 14px; }
.days { display: grid; gap: 10px; }
.day {
  display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 4px 12px; align-items: center;
  padding: 12px 10px 12px 14px; border-radius: var(--r-2); background: var(--surface); border: 1px solid var(--line);
}

.day-date { display: grid; justify-items: center; align-content: center; line-height: 1; }
.day-date .dow { font-size: 12.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.day-date .dnum { font-family: var(--font-sign); font-weight: 800; font-size: 30px; font-variant-numeric: tabular-nums; margin-top: 2px; }
.day-dish { display: grid; gap: 4px; text-align: left; min-width: 0; padding: 2px 0; }
button.day-dish:hover .day-name { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; }
.day-name { font-family: var(--font-sign); font-weight: 800; font-size: 23px; line-height: 1; font-variation-settings: "opsz" 72; overflow-wrap: anywhere; }
.day-meta { font-size: 14px; color: var(--ink-2); }

.day.is-off .day-name, .day.is-empty .day-name { color: var(--ink-2); }
.today-pill { margin-top: 6px; font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ketchup); }
.day-acts { grid-column: 2; display: flex; gap: 2px; margin-left: -10px; }
.day-acts .btn-icon { width: 40px; height: 40px; }
@media (min-width: 640px) {
  .day { grid-template-columns: 60px minmax(0, 1fr) auto; }
  .day-acts { grid-column: auto; margin-left: 0; }
}
.week-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; }

/* ---------- list ---------- */
.list-acts { display: flex; flex-wrap: wrap; gap: 8px; }
.progress { height: 10px; border-radius: 5px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--relish); transition: width .25s ease; }

.add-item { display: flex; gap: 8px; margin: 18px 0 6px; }
.add-item input { flex: 1; min-width: 0; min-height: 46px; padding: 0 14px; border-radius: var(--r-1); border: 1.5px solid var(--line-strong); background: var(--surface); font-size: 16px; }
.add-item input:focus { outline: none; border-color: var(--ink); }
.list-cols { columns: 1; column-gap: 32px; margin-top: 10px; }
@media (min-width: 900px) { .list-cols { columns: 2; } }
.aisle { break-inside: avoid; padding-top: 14px; }
.aisle-h { display: flex; align-items: baseline; gap: 8px; font-family: var(--font-sign); font-weight: 800; font-size: 22px; line-height: 1; padding-bottom: 6px; border-bottom: 2px solid var(--ink); font-variation-settings: "opsz" 72; }
.aisle-h span { font-family: var(--font-body); font-size: 13px; font-weight: 700; color: var(--ink-2); }
.li label { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 2px; border-bottom: 1px dashed var(--line); cursor: pointer; }
.li-main { display: block; font-size: 16px; }
.li-q { font-variant-numeric: tabular-nums; }
.li-sub { display: block; font-size: 13px; color: var(--ink-3); margin-top: 1px; }
.li.done .li-main { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--ink-3); }
.li .del { width: 34px; height: 34px; margin-top: -6px; }
.check {
  appearance: none; -webkit-appearance: none; width: 24px; height: 24px; margin: 0; border-radius: 6px; border: 2px solid var(--line-strong);
  background: var(--surface); display: grid; place-items: center; cursor: pointer; transition: background-color .12s, border-color .12s;
}
.check::after { content: ""; width: 6px; height: 11px; border: solid var(--on-ketchup); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-1px, -1px); opacity: 0; }
.check:checked { background: var(--relish); border-color: var(--relish); }
.check:checked::after { opacity: 1; border-color: var(--surface); }
.check:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
details.pantry { break-inside: avoid; margin-top: 18px; border: 1px solid var(--line); border-radius: var(--r-2); background: var(--surface-2); padding: 0 14px; }
details.pantry summary { cursor: pointer; padding: 14px 0; font-weight: 700; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
details.pantry summary::-webkit-details-marker { display: none; }

details.pantry .li label { border-bottom-color: var(--line); }
.also { margin-top: 22px; }
.also .chips { margin-top: 8px; }
.sync-note { margin-top: 24px; font-size: 13.5px; color: var(--ink-3); display: flex; align-items: center; gap: 8px; }
.sync-note .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
.sync-note.on .dot { background: var(--relish); }

/* ---------- recipes ---------- */
.rx-tools { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; margin-bottom: 12px; align-items: center; }
.rx-sort { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; color: var(--ink-2); }
.rx-sort select { min-height: 46px; padding: 0 10px; border-radius: var(--r-1); border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: 700; }
.rx-grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .rx-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1024px) { .rx-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.rx { position: relative; }
.rx-open {
  display: grid; gap: 8px; align-content: start; width: 100%; height: 100%; text-align: left; padding: 16px 16px 14px; border-radius: var(--r-2);
  background: var(--surface); border: 1px solid var(--line); transition: border-color .12s, transform .12s;
}
.rx-open:hover { border-color: var(--ink); transform: translateY(-1px); }
.rx-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-right: 40px; }
.rx-name { font-family: var(--font-sign); font-weight: 800; font-size: 26px; line-height: .98; font-variation-settings: "opsz" 72; text-wrap: balance; }
.rx-blurb { font-size: 15px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rx-meta { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink-2); font-weight: 600; margin-top: 2px; }
.rx-meta .ic { width: 16px; height: 16px; }
.rx .fav { position: absolute; top: 6px; right: 6px; }
.rx-count { font-size: 14px; color: var(--ink-2); margin-bottom: 10px; font-weight: 600; }

/* ---------- sheet (recipe, picker, ask) ---------- */
.sheet { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; justify-content: flex-end; }
.sheet-backdrop { position: absolute; inset: 0; background: var(--scrim); animation: fade .2s ease both; }
.sheet-panel {
  position: relative; width: 100%; max-height: calc(100% - 28px - env(safe-area-inset-top, 0px)); overflow: auto; overscroll-behavior: contain;
  background: var(--surface); border-radius: var(--r-3) var(--r-3) 0 0; box-shadow: var(--shadow-2);
  padding-bottom: env(safe-area-inset-bottom, 0px); animation: rise .26s cubic-bezier(.2, .8, .2, 1) both;
}
.sheet-panel:focus { outline: none; }
@keyframes rise { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (min-width: 760px) {
  .sheet { align-items: center; justify-content: center; padding: 28px; }
  .sheet-panel { width: min(960px, 100%); max-height: calc(100vh - 56px); border-radius: var(--r-3); }
  .sheet-panel.narrow { width: min(620px, 100%); }
}
.sheet-in { padding: 0 max(20px, env(safe-area-inset-right, 0px)) 28px max(20px, env(safe-area-inset-left, 0px)); }
.sh-bar {
  position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px;
  padding: 6px max(10px, env(safe-area-inset-right, 0px)) 6px max(20px, env(safe-area-inset-left, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.sh-bar .sh-t { font-weight: 800; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rs-head { padding-top: 20px; }
.rs-cat { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ai-badge { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: var(--mustard-wash); color: var(--mustard-ink); }
.rs-title { font-family: var(--font-sign); font-weight: 800; font-size: clamp(36px, 8vw, 54px); line-height: .92; margin-top: 10px; text-wrap: balance; font-variation-settings: "opsz" 72; overflow-wrap: anywhere; }
.rs-blurb { margin-top: 12px; font-size: 18px; max-width: 58ch; }
.rs-facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 18px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.rs-facts > div { padding: 10px 10px 10px 0; min-width: 0; }
.rs-facts > div + div { padding-left: 12px; border-left: 1px solid var(--line); }
.rs-facts dt { font-size: 11.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.rs-facts dd { font-family: var(--font-sign); font-weight: 800; font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 420px) {
  .rs-facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rs-facts > div:nth-child(3) { padding-left: 0; border-left: 0; }
  .rs-facts > div:nth-child(n+3) { border-top: 1px solid var(--line); }
}
.rs-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.rs-actions .btn-primary { flex: 1 1 200px; }
.rs-actions .btn-line { flex: 0 1 auto; }
.daypick { margin-top: 12px; padding: 14px; border-radius: var(--r-2); background: var(--surface-2); border: 1px solid var(--line); }
.daypick p { font-weight: 700; margin-bottom: 10px; }
.daypick-grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.daypick-grid button { text-align: left; padding: 10px 12px; border-radius: var(--r-1); border: 1.5px solid var(--line-strong); background: var(--surface); min-width: 0; }
.daypick-grid button:hover { border-color: var(--ink); }
.daypick-grid b { display: block; font-size: 14px; }
.daypick-grid span { display: block; font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rs-body { display: grid; gap: 28px; margin-top: 26px; }
@media (min-width: 760px) { .rs-body { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 36px; } }
.rs-sec-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 2px solid var(--ink); }
.rs-sec-h h3 { font-family: var(--font-sign); font-weight: 800; font-size: 26px; line-height: 1; font-variation-settings: "opsz" 72; }
.ing-list li label { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; padding: 9px 0; border-bottom: 1px dashed var(--line); cursor: pointer; }
.ing-list .q { font-weight: 800; font-variant-numeric: tabular-nums; }
.ing-list .opt { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-left: 4px; }
.ing-list li.done .ing-t { color: var(--ink-3); text-decoration: line-through; }
.scale-note { margin-top: 10px; font-size: 14px; color: var(--ink-2); }
.step-list { counter-reset: step; display: grid; }
.step-list li { counter-increment: step; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
.step-list li::before { content: counter(step); font-family: var(--font-sign); font-weight: 800; font-size: 26px; line-height: 1; color: var(--ketchup); font-variant-numeric: tabular-nums; }
.step-list p { font-size: 17px; max-width: 62ch; }
.timer-btn { grid-column: 2; justify-self: start; display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1.5px solid var(--line-strong); font-weight: 700; font-size: 14px; }
.timer-btn:hover { border-color: var(--ink); }
.timer-btn .ic { width: 17px; height: 17px; }
.tip { margin-top: 20px; padding: 16px; border-radius: var(--r-2); background: var(--ticket); }
.tip h4 { font-size: 13px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ticket-ink); margin-bottom: 4px; }
.rs-notes { margin-top: 16px; display: grid; gap: 4px; }
.rs-notes dt { font-weight: 800; margin-top: 10px; }
.rs-notes dd { color: var(--ink-2); max-width: 62ch; }
.rs-price-note { margin-top: 18px; font-size: 13px; color: var(--ink-3); }

.pick-list { display: grid; gap: 8px; margin-top: 14px; }
.pick-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; width: 100%; text-align: left; padding: 12px 14px; border-radius: var(--r-2); border: 1px solid var(--line); background: var(--surface); }
.pick-row:hover { border-color: var(--ink); }
.pick-row .p-name { font-family: var(--font-sign); font-weight: 800; font-size: 22px; line-height: 1; font-variation-settings: "opsz" 72; }
.pick-row .p-meta { grid-column: 1 / -1; font-size: 14px; color: var(--ink-2); }

.ask form { display: grid; gap: 16px; padding-top: 18px; }
.ask label.big { font-weight: 800; font-size: 18px; }
.ask textarea { width: 100%; min-height: 120px; padding: 12px 14px; border-radius: var(--r-1); border: 1.5px solid var(--line-strong); background: var(--surface); font-size: 16px; resize: vertical; line-height: 1.45; }
.ask textarea:focus { outline: none; border-color: var(--ink); }
.ask fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.ask legend { font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 8px; padding: 0; }
.ask-status { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: var(--r-2); background: var(--surface-2); border: 1px solid var(--line); }
.ask-status .bar { flex: 1; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.ask-status .bar span { display: block; height: 100%; width: 30%; background: var(--ketchup); border-radius: 4px; transition: width .3s ease; }
.ask-status .bar.indef span { animation: indef 1.3s ease-in-out infinite; }
@keyframes indef { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
.ask-err { padding: 12px 14px; border-radius: var(--r-1); background: var(--mustard-wash); color: var(--mustard-ink); font-weight: 600; }

/* ---------- cook mode ---------- */
.cook {
  position: fixed; inset: 0; z-index: 80; background: var(--surface); color: var(--ink);
  display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.ck-top { display: flex; align-items: center; gap: 10px; padding: 8px max(12px, env(safe-area-inset-right, 0px)) 8px max(8px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.ck-name { flex: 1; min-width: 0; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ck-prog { display: flex; gap: 4px; padding: 12px var(--gut-r) 0 var(--gut-l); }
.ck-prog span { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.ck-prog span.done { background: var(--relish); }
.ck-prog span.cur { background: var(--ketchup); }
.ck-main { overflow: auto; padding: 24px var(--gut-r) 24px var(--gut-l); display: grid; align-content: center; justify-items: start; gap: 18px; max-width: 900px; width: 100%; margin: 0 auto; }
.ck-stepno { font-size: 14px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ketchup); }
.ck-text { font-size: clamp(23px, 4.6vw, 36px); line-height: 1.32; font-weight: 600; max-width: 34ch; }
.ck-main .timer-btn { margin-top: 0; min-height: 48px; padding: 0 18px; font-size: 17px; }
.ck-wake { font-size: 13px; color: var(--ink-3); }
.ck-done { display: grid; gap: 14px; justify-items: start; }
.ck-done h2 { font-family: var(--font-sign); font-weight: 800; font-size: clamp(44px, 10vw, 72px); line-height: .9; font-variation-settings: "opsz" 72; }
.ck-foot { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; padding: 12px var(--gut-r) 14px var(--gut-l); border-top: 1px solid var(--line); }
.ck-drawer {
  position: absolute; inset: 0; z-index: 3; background: var(--surface); overflow: auto;
  padding: env(safe-area-inset-top, 0px) var(--gut-r) calc(24px + env(safe-area-inset-bottom, 0px)) var(--gut-l);
}
.ck-drawer .sh-bar { margin: 0 calc(-1 * var(--gut-r)) 10px calc(-1 * var(--gut-l)); }

/* ---------- timers and toasts ---------- */
html.has-timers main { padding-bottom: calc(var(--tabbar-h) + 120px + env(safe-area-inset-bottom, 0px)); }
html.has-timers .sheet-in { padding-bottom: 104px; }
@media (max-width: 759px) { .sheet-panel { min-height: 58%; } }
.timers {
  position: fixed; z-index: 90; right: max(12px, env(safe-area-inset-right, 0px));
  bottom: calc(var(--tabbar-h) + 12px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 8px; justify-items: end; pointer-events: none;
}
.cook-open .timers { bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 1024px) { .timers { bottom: 20px; } }
.tm {
  pointer-events: auto; display: flex; align-items: center; gap: 4px; padding: 6px 6px 6px 14px; border-radius: 999px;
  background: var(--ink); color: var(--bg); box-shadow: var(--shadow-2); max-width: calc(100vw - 24px);
}
.tm-time { font-family: var(--font-sign); font-weight: 800; font-size: 24px; font-variant-numeric: tabular-nums; min-width: 3.1ch; }
.tm-label { font-size: 13px; font-weight: 600; opacity: .85; max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0 4px; }
.tm .btn-icon { width: 36px; height: 36px; color: inherit; }
.tm .btn-icon:hover { background: color-mix(in srgb, var(--bg) 18%, transparent); }
.tm.paused .tm-time { opacity: .6; }
.tm.ding { background: var(--ketchup); color: var(--on-ketchup); animation: ding 1s ease-in-out infinite; }
@keyframes ding { 50% { transform: scale(1.04); } }
.toasts {
  position: fixed; z-index: 100; left: 50%; transform: translateX(-50%); width: min(520px, calc(100vw - 24px));
  bottom: calc(var(--tabbar-h) + 14px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; pointer-events: none;
}
@media (min-width: 1024px) { .toasts { bottom: 24px; } }
.toast {
  pointer-events: auto; display: flex; align-items: center; gap: 12px; justify-content: space-between; padding: 12px 14px 12px 16px;
  border-radius: var(--r-2); background: var(--ink); color: var(--bg); box-shadow: var(--shadow-2); font-weight: 600; font-size: 15px;
  animation: rise .22s ease both;
}
.toast.out { opacity: 0; transform: translateY(8px); transition: opacity .25s, transform .25s; }
.toast-btn { font-weight: 800; text-decoration: underline; text-underline-offset: 3px; color: inherit; white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}


/* ---------- site footer (scoopanddude.com only) ---------- */
.site-foot { margin-top: 44px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink-2); }
.site-foot a { color: var(--ink); font-weight: 700; text-underline-offset: 3px; }

    const cheap = clamp(3.1 / Math.max(r.cps || 3, 0.6), 0.3, 2.4);
    const easy = (r.d === 1 ? 1 : 0.6) * (r.a <= 20 ? 1.2 : r.a <= 30 ? 1 : 0.8);
    return cheap * easy;
  }
  function dayWeight(r, d) {
    let w = baseWeight(r);
    const dow = d.getDay();
    const weekend = dow === 0 || dow === 6;
    if (r.tags.includes(seasonOf(d))) w *= 1.6;
    if (dow === 5 && r.tags.includes('fun')) w *= 1.8;
    if (weekend && (r.tags.includes('weekend') || r.t >= 45)) w *= 1.5;
    if (!weekend && r.t <= 30) w *= 1.25;
    if (r.tags.includes('slow')) w *= weekend ? (dow === 0 ? 1.4 : 0.8) : 0.2;
    if (r.tags.includes('date')) w *= weekend ? 0.7 : 0.35;
    return w;
  }
  function genPlan(dates, rand, fixed) {
    const out = [];
    const used = new Set();
    const pc = {};
    for (const d of dates) { const v = fixed[isoOf(d)]; const r = v && R.get(v); if (r) { used.add(v); pc[r.p] = (pc[r.p] || 0) + 1; } }
    dates.forEach((d, i) => {
      const key = isoOf(d);
      if (fixed[key] !== undefined) { out.push(fixed[key]); return; }
      const prev = out[i - 1] && R.get(out[i - 1]);
      const nextId = fixed[isoOf(addDays(d, 1))];
      const next = nextId && R.get(nextId);
      const capP = (p) => (p === 'chicken' ? 3 : 2);
      let pool = BUILTIN.filter((r) => !used.has(r.id) && dayFits(r, d) && (!prev || r.p !== prev.p) && (!next || r.p !== next.p) && (pc[r.p] || 0) < capP(r.p));
      if (!pool.length) pool = BUILTIN.filter((r) => !used.has(r.id) && dayFits(r, d));
      if (!pool.length) pool = BUILTIN.slice();
      const pick = weightedPick(pool, (r) => dayWeight(r, d) * (pc[r.p] ? 1 : 1.5), rand);

  const weekCache = new Map();

  function suggestionFor(iso) { const d = dateOf(iso); return suggestedWeek(isoOf(mondayOf(d)))[(d.getDay() + 6) % 7]; }
  function planFor(iso) { const v = S.plan[iso]; if (v === undefined) return suggestionFor(iso); if (v && v !== 'off' && !R.has(v)) return ''; return v; }
  const isCustomWindow = () => windowDates().some((d) => S.plan[isoOf(d)] !== undefined);
  function materialize() { for (const d of windowDates()) { const k = isoOf(d); if (S.plan[k] === undefined) S.plan[k] = suggestionFor(k); } }
  function weekEntries() {
    return windowDates().map((d) => { const iso = isoOf(d); const v = planFor(iso); const r = v && v !== 'off' ? R.get(v) : null; return { d, iso, v, r }; });
  }
  function weekCost() {
    let total = 0, n = 0;

  function recentlyMade(days) {

    const iso = isoOf(startOfToday());

  function startByText(r) {
    const mins = 18 * 60 - r.t;

  }

  /* ---------- Tonight: filters and spins ---------- */
  function filteredPool() {
    const f = UI.filters;
    const hour = new Date().getHours();
    return BUILTIN.concat(cookbookList()).filter((r) =>
      (!f.time || r.t <= f.time) && (!f.cost || (r.cps && r.cps < f.cost)) && (!f.protein || r.p === f.protein) &&
      f.moods.every((m) => r.tags.includes(m)) && (f.moods.includes('slow') || !r.tags.includes('slow') || hour < 11));

    const all = filteredPool();

    const recent = new Set(UI.spinHist.slice(-12));
    const made = recentlyMade(14);
    let pool = all.filter((r) => r.id !== current && !recent.has(r.id) && !made.has(r.id));
    if (!pool.length) pool = all.filter((r) => r.id !== current);
    if (!pool.length) { toast(all.length ? "That's the only dinner that fits. Loosen a filter for more." : 'Nothing matches those filters. Try removing one.'); return; }
    const now = new Date();
    const late = now.getHours() >= 19;
    const pick = weightedPick(pool, (r) => baseWeight(r) * (r.tags.includes(seasonOf(now)) ? 1.5 : 1) * (late && r.t <= 30 ? 1.8 : 1), Math.random);
    UI.spinId = pick.id;
    UI.spinHist.push(pick.id);

    if (UI.tab !== 'tonight') setTab('tonight');
    else renderTonight();

    if (t && t.getBoundingClientRect().top < 0) t.scrollIntoView({ block: 'start', behavior: 'smooth' });
  }

  /* ---------- Fridge matching ---------- */
  function fridgeMatches() {
    const have = new Set(S.fridge);
    const hasChip = (c) => have.has(c) || (CHIP_EQUIV[c] || []).some((x) => have.has(x));
    const out = [];
    for (const r of BUILTIN) {
      if (!r.chips.length) continue;
      const got = r.chips.filter(hasChip);
      if (!got.length) continue;
      const missing = r.chips.filter((c) => !hasChip(c));
      if (missing.length > 3) continue;
      out.push({ r, got: got.length, total: r.chips.length, missing, mainMissing: r.mainChip && !hasChip(r.mainChip) ? 1 : 0 });
    }
    out.sort((a, b) => a.mainMissing - b.mainMissing || a.missing.length - b.missing.length || b.got - a.got || a.r.cps - b.r.cps);
    return out;
  }

  /* =========================================================
     Ingredient lines
     ========================================================= */
  function splitPrep(prep) {
    let adj = '';

      const i = prep.indexOf(',');

      prep = i < 0 ? '' : prep.slice(i + 1).trim();
    }
    return { adj, prep };
  }
  function ingInfo(e, factor, short) {
    const q0 = e[0], u = e[1] || '', key = e[2], fl = e[4];
    const def = ING[key] || [key, 0, 'other', 0, {}];
    const ex = def[4] || {};
    let q = q0 == null ? null : q0 * (factor || 1);
    if (q != null) q = ex.w && !u ? Math.max(1, Math.round(q)) : roundQty(q, u);
    const sp = splitPrep(e[3]);
    const isCount = !u;
    let name;
    if (short && ex.short && !(isCount && q != null && q <= 1)) name = ex.short;
    else if (isCount) name = q != null && q > 1 ? (def[1] || def[0]) : def[0];
    else name = def[1] || def[0];
    let unitStr = u ? unitWord(u, q) : '';
    if (u && ex.size && !short) unitStr += ` (${ex.size})`;
    return { q, u, unitStr, adj: short ? '' : sp.adj, name, prep: sp.prep, optional: fl === 'o', staple: !!ex.s, key };
  }
  function ingLineHTML(info) {
    const nm = esc((info.adj ? info.adj + ' ' : '') + info.name);
    const pr = info.prep ? `, ${esc(info.prep)}` : '';
    if (info.q == null) return `${cap(nm)}${pr}`;
    return `<span class="q">${qtyHTML(info.q)}${info.unitStr ? ' ' + esc(info.unitStr) : ''}</span> ${nm}${pr}`;
  }
  const shortName = (r) => (r.n.length > 26 ? r.n.split(/ with | & | \(/)[0] : r.n);

  /* =========================================================
     Grocery list
     ========================================================= */
  const PREF_TBSP = new Set(['butter', 'tomato_paste', 'ginger', 'dijon', 'hoisin', 'sesame_oil', 'curry_powder', 'cajun', 'soy_sauce', 'honey', 'worcestershire', 'vinegar', 'olive_oil', 'veg_oil', 'mayo', 'ketchup', 'mustard', 'brown_sugar', 'cornstarch', 'dill', 'parsley']);
  const NO_QTY = new Set(['salt', 'pepper']);
  function listSources() {
    const out = [];
    for (const e of weekEntries()) if (e.r) out.push({ r: e.r, factor: S.servings / e.r.s });
    for (const x of S.extraRecipes) { const r = R.get(x.id); if (r) out.push({ r, factor: x.s / r.s, extra: true }); }
    return out;
  }
  function buildList() {
    const map = new Map();
    for (const src of listSources()) {
      for (const e of src.r.i) {
        let q = e[0], u = e[1] || '', key = e[2];
        const fl = e[4];
        let def = ING[key];
        if (!def) continue;
        let ex = def[4] || {};
        if (ex.hide) continue;
        if (ex.conv) { q = q == null ? null : q * ex.conv[1]; u = ex.conv[2] || u; key = ex.conv[0]; def = ING[key]; ex = def[4] || {}; }
        const fam = famOf(u);
        const id = key + '|' + fam;
        let it = map.get(id);
        if (!it) { it = { id, key, fam, unit: u, base: 0, hasQ: false, from: [], optional: true, staple: !!ex.s, aisle: def[2] }; map.set(id, it); }
        if (q != null) { it.hasQ = true; it.base += q * src.factor * (fam === 'wt' ? WT[u] : fam === 'vol' ? VOL[u] : 1); }
        if (!it.from.includes(src.r.n)) it.from.push(src.r.n);
        if (fl !== 'o') it.optional = false;

  function listQty(it) {
    const def = ING[it.key];
    const ex = def[4] || {};

      <div class="flt-foot"><span class="count${n ? '' : ' zero'}" aria-live="polite">${n ? `${n} ${plural(n, 'dinner fits', 'dinners fit')}` : 'No dinners match. Remove a filter.'}</span>${filtersActive() ? '<button type="button" class="btn-quiet" data-act="f-reset">Reset</button>' : ''}<button type="button" class="btn btn-primary sm" data-act="spin"${n ? '' : ' disabled'}>${ic('shuffle')} Spin</button></div>
    </section>`;
  }
  function miniHTML(r) {
    return `<button type="button" class="mini" data-act="open-recipe" data-id="${r.id}"><span class="ptag p-${r.p}">${P_NAME[r.p]}</span>${priceTag(r)}<span class="m-name">${esc(r.n)}</span><span class="m-meta">${fmtTime(r.t)} · ${effortWord(r)}</span></button>`;
  }
  function altsHTML(currentId) {
    const made = recentlyMade(14);
    const pool = filteredPool().filter((r) => r.id !== currentId && !r.ai && !made.has(r.id));
    if (!pool.length) return '';
    const now = new Date();
    const rand = rng(hashStr(isoOf(startOfToday()) + JSON.stringify(UI.filters) + (currentId || '')));
    const top = pool.map((r) => ({ r, s: baseWeight(r) * (r.tags.includes(seasonOf(now)) ? 1.4 : 1) * (0.55 + rand()) })).sort((a, b) => b.s - a.s).slice(0, 3);
    return `<section aria-labelledby="alt-h"><h2 class="sec-h" id="alt-h">Also good tonight</h2><div class="mini-list">${top.map((x) => miniHTML(x.r)).join('')}</div></section>`;
  }
  function renderTonight() {
    const today = startOfToday();
    const cur = UI.spinId || tonightInfo().v;
    const ask = AI.ok ? `<section class="callout"><h2>Got odds and ends in the fridge?</h2><p>Tell the chef what you have and get a cheap recipe built around it.</p><button type="button" class="btn btn-line" data-act="ask-open">${ic('hat')} Ask the chef</button></section>` : '';
    patch($('#s-tonight'), `<div class="wrap">
      <div class="greet">
        <p class="eyebrow">${DOW_LONG[today.getDay()]}, ${MON_LONG[today.getMonth()]} ${today.getDate()}</p>
        <h1>What's for dinner? Here's the scoop.</h1>
        <p class="greet-sub">Cheap, easy dinners that taste like you tried.</p>
      </div>
      <div class="tonight-grid">
        <div class="tonight-main">${ticketHTML()}</div>
        <div class="tonight-side">${filtersHTML()}${altsHTML(cur)}${ask}</div>
      </div>
    </div>`);
  }

  /* =========================================================
     Screen: Fridge
     ========================================================= */
  function matchHTML(m) {
    const r = m.r;
    const pct = Math.round(m.got / m.total * 100);
    const need = m.missing.map((c) => r.chipName[c] || (CHIP_MAP.get(c) || {}).label || c);
    return `<li><button type="button" class="match" data-act="open-recipe" data-id="${r.id}">
      <span class="m-top"><span class="ptag p-${r.p}">${P_NAME[r.p]}</span>${priceTag(r)}</span>
      <span class="m-name">${esc(r.n)}</span>
      <span class="meter" aria-hidden="true"><span style="width:${pct}%"></span></span>
      ${m.missing.length ? `<span class="m-have">You have ${m.got} of ${m.total} main ingredients</span><span class="m-need">Need: ${esc(need.join(', '))}</span>` : '<span class="m-ready">You have everything you need</span>'}
      <span class="m-need">${fmtTime(r.t)} · ${effortWord(r)}</span>
    </button></li>`;
  }
  function renderFridge() {
    const have = new Set(S.fridge);
    const q = UI.fridgeQ.trim().toLowerCase();
    const groups = CHIP_GROUPS.map(([g, label, shown]) => {
      let chips = CHIPS.filter((c) => c[2] === g);
      if (q) chips = chips.filter((c) => c[1].toLowerCase().includes(q) || c[0].replace(/_/g, ' ').includes(q));
      if (!chips.length) return '';
      const expanded = q || UI.fridgeMore[g];
      const visible = expanded ? chips : chips.filter((c, i) => i < shown || have.has(c[0]));
      const hiddenN = chips.length - visible.length;
      return `<section class="cg" aria-labelledby="cg-${g}"><h2 class="cg-h" id="cg-${g}">${label}</h2><div class="chips">${visible.map((c) => `<button type="button" class="chip" id="chip-${c[0]}" aria-pressed="${have.has(c[0])}" data-act="fridge-toggle" data-k="${c[0]}">${have.has(c[0]) ? ic('check') : ''}${esc(c[1])}</button>`).join('')}</div>${hiddenN > 0 ? `<button type="button" class="btn-quiet more" id="more-${g}" data-act="fridge-more" data-g="${g}">Show ${hiddenN} more</button>` : ''}</section>`;
    }).join('') || `<p class="empty" style="margin-top:14px">Nothing called “${esc(UI.fridgeQ)}” here. Try a simpler word, like “cheese” or “beans”.</p>`;
    let results;
    let count = 0;
    if (!S.fridge.length) {
      results = `<h2 class="sec-h">Dinners you can make</h2><div class="empty"><b>Start with what you've got.</b> Tap a few things, like chicken, rice or eggs, and the dinners that use them show up here, closest match first.</div>`;
    } else {
      const ms = fridgeMatches();
      count = ms.length;
      const ready = ms.filter((m) => !m.missing.length).length;
      const close = ms.filter((m) => m.missing.length && m.missing.length <= 2).length;
      const shown = ms.slice(0, UI.fridgeShow);
      const summary = ms.length
        ? [ready ? `${ready} ${plural(ready, 'dinner', 'dinners')} you can make right now.` : '', close ? `${close} more ${plural(close, 'needs', 'need')} just 1 or 2 things.` : '', !ready && !close ? 'These are the closest matches.' : ''].filter(Boolean).join(' ')
        : "Nothing's a close match yet. Add a few more things you have, like an onion, rice or cheese.";
      results = `<h2 class="sec-h">Dinners you can make</h2><p class="muted" style="margin:-4px 0 12px">${summary}</p><ol class="match-list">${shown.map(matchHTML).join('')}</ol>${ms.length > shown.length ? `<button type="button" class="btn btn-line" style="margin-top:12px" data-act="fridge-showmore">Show more</button>` : ''}`;
    }
    const sc = UI.scan;
    const scan = sc ? `<div class="scan" role="status">${sc.url ? `<img src="${sc.url}" alt="Your photo">` : ''}<div><p>${sc.busy ? 'Looking at your photo…' : esc(sc.msg)}</p>${sc.other && sc.other.length ? `<p class="scan-other">Also spotted: ${esc(sc.other.join(', '))}. <button type="button" class="btn-quiet" style="min-height:0;padding:0" data-act="ask-with-other">Ask the chef to use these</button></p>` : ''}</div></div>` : '';
    const aiRow = AI.ok ? `<div class="ai-row">${AI.images ? `<button type="button" class="btn btn-line" data-act="scan-open"${sc && sc.busy ? ' disabled' : ''}>${ic('camera')} Snap your fridge</button>` : ''}<button type="button" class="btn btn-line" data-act="ask-open">${ic('hat')} Ask the chef</button></div>` : '';
    patch($('#s-fridge'), `<div class="wrap">
      <header class="scr-head"><div><h1>What's in your kitchen?</h1><p>Tap what you have and I'll find dinners that use it up. Salt, oil, butter, flour, sugar and everyday spices are assumed.</p></div></header>
      ${aiRow}${scan}
      <div class="fridge-grid">
        <div class="fridge-pick">
          <div class="searchbox">${ic('search')}<label class="vh" for="fridge-q">Find an ingredient</label><input id="fridge-q" type="search" placeholder="Find an ingredient" autocomplete="off" value="${esc(UI.fridgeQ)}"></div>
          <div class="picked-bar"><span aria-live="polite">${S.fridge.length ? `${S.fridge.length} picked` : 'Nothing picked yet'}</span>${S.fridge.length ? '<button type="button" class="btn-quiet" data-act="fridge-clear">Clear all</button>' : ''}</div>
          ${groups}
        </div>
        <div class="fridge-results" id="fridge-results" tabindex="-1">${results}</div>
      </div>
      ${count ? `<button type="button" class="jump" data-act="jump-results">See ${count} ${plural(count, 'dinner', 'dinners')} ${ic('arrow-down')}</button>` : ''}
    </div>`);
  }

  /* =========================================================
     Screen: Week
     ========================================================= */
  function dayHTML(e, i) {
    const d = e.d;
    const isToday = i === 0;
    const r = e.r;
    const dn = DOW_LONG[d.getDay()];
    let dish;
    let state = '';
    if (e.v === 'off') {
      state = ' is-off';
      dish = `<div class="day-dish"><span class="day-name">Night off</span><span class="day-meta">Leftovers, takeout or cereal. No judgment.</span></div>`;
    } else if (!r) {
      state = ' is-empty';
      dish = `<div class="day-dish"><span class="day-name">Nothing planned</span><span class="day-meta">Swap for an idea or choose one.</span></div>`;
    } else {
      const slow = r.tags.includes('slow') ? ` · <span class="start">Start by ${startByText(r)}</span>` : '';
      dish = `<button type="button" class="day-dish" data-act="open-recipe" data-id="${r.id}"><span class="ptag p-${r.p}">${P_NAME[r.p]}</span><span class="day-name">${esc(r.n)}</span><span class="day-meta">${fmtTime(r.t)} · ${r.cps ? money(r.cps) + ' a serving' : 'cost not estimated'}${slow}</span></button>`;
    }
    return `<li class="day${isToday ? ' is-today' : ''}${state}">
      <div class="day-date"><span class="dow">${DOW[d.getDay()]}</span><span class="dnum">${d.getDate()}</span>${isToday ? '<span class="today-pill">Tonight</span>' : ''}</div>
      ${dish}
      <div class="day-acts">
        <button type="button" class="btn-icon" id="sw-${e.iso}" data-act="day-swap" data-d="${e.iso}" aria-label="Swap ${dn}'s dinner for another idea" title="Swap for another idea">${ic('shuffle')}</button>
        <button type="button" class="btn-icon" id="pk-${e.iso}" data-act="day-pick" data-d="${e.iso}" aria-label="Choose ${dn}'s dinner" title="Choose a recipe">${ic('list')}</button>
        <button type="button" class="btn-icon" id="off-${e.iso}" data-act="day-off" data-d="${e.iso}" aria-pressed="${e.v === 'off'}" aria-label="Night off on ${dn}" title="Night off">${ic('moon')}</button>
      </div>
    </li>`;
  }
  function renderWeek() {
    const ents = weekEntries();
    const first = ents[0].d, last = ents[6].d;
    const wc = weekCost();
    const custom = isCustomWindow();
    const items = listView();
    patch($('#s-week'), `<div class="wrap">
      <header class="scr-head"><div><h1>This week</h1><p>${DOW[first.getDay()]}, ${MON[first.getMonth()]} ${first.getDate()} to ${DOW[last.getDay()]}, ${MON[last.getMonth()]} ${last.getDate()}</p></div>
        <div class="stepper" role="group" aria-label="Cooking for"><span class="lbl">Cooking for</span><button type="button" id="sv-dec" data-act="serv-dec" aria-label="Fewer people">${ic('minus')}</button><output class="num" aria-live="polite">${S.servings}</output><button type="button" id="sv-inc" data-act="serv-inc" aria-label="More people">${ic('plus')}</button></div>
      </header>
      <div class="week-sum">
        <div class="ws-cost"><span class="l">Food cost for the week</span><b class="num">${wc.n ? moneyR(wc.total) : '$0'}</b><span class="per">${wc.n ? `about ${money(wc.per)} a serving, ${wc.n} ${plural(wc.n, 'dinner', 'dinners')} for ${S.servings}` : 'Plan a dinner to see the cost'}</span></div>
        <div class="ws-actions">
          <button type="button" class="btn btn-line sm" data-act="week-cheaper"${wc.n ? '' : ' disabled'}>${ic('trend-down')} Make it cheaper</button>
          <button type="button" class="btn btn-line sm" data-act="week-new">${ic('shuffle')} New week</button>
          <button type="button" class="btn btn-quiet" data-act="week-clear">Clear</button>
        </div>
      </div>
      ${custom ? '' : `<p class="banner">Here's a week I'd cook. Weeknights stay quick and cheap, and the weekend gets something slower. Swap any night that doesn't fit.</p>`}
      <ol class="days">${ents.map(dayHTML).join('')}</ol>
      <div class="week-foot"><p class="muted">${wc.n} ${plural(wc.n, 'dinner', 'dinners')} planned · ${items.total} ${plural(items.total, 'thing', 'things')} on your grocery list</p><button type="button" class="btn btn-primary" data-act="tab" data-tab="list">${ic('cart')} Open grocery list</button></div>
      <p class="fineprint">Costs are estimates from typical US grocery prices. They count what each recipe uses, including a little of your pantry staples. Your receipt will run higher because stores sell whole packages, and the extra carries into next week.</p>
    </div>`);
  }

  /* =========================================================
     Screen: Grocery list
     ========================================================= */
  function liHTML(it) {
    const done = !!S.checks[it.id];
    const qty = it.q != null && !NO_QTY.has(it.key) ? `<b class="li-q">${qtyHTML(it.q)}${it.qUnit ? ' ' + esc(it.qUnit) : ''}</b> ` : '';
    const hint = (ING[it.key][4] || {}).buy;
    const sub = [it.from.length > 2 ? `${it.from.length} recipes` : it.from.join(', ')].concat(hint ? [hint] : []).join(' · ');
    const cid = 'li-' + it.id.replace(/[^a-z0-9]/gi, '-');
    return `<li class="li${done ? ' done' : ''}${it.optional ? ' opt' : ''}"><label for="${cid}"><input type="checkbox" class="check" id="${cid}" data-act="li-check" data-key="${esc(it.id)}"${done ? ' checked' : ''}><span><span class="li-main">${qty}${esc(it.name)}</span><span class="li-sub">${esc(sub)}</span></span><span></span></label></li>`;
  }
  function renderList() {
    const v = listView();
    const ents = weekEntries();
    const n = ents.filter((e) => e.r).length;
    const first = ents[0].d, last = ents[6].d;
    const range = `${MON[first.getMonth()]} ${first.getDate()} to ${first.getMonth() === last.getMonth() ? '' : MON[last.getMonth()] + ' '}${last.getDate()}`;
    const pct = v.total ? Math.round(v.done / v.total * 100) : 0;
    const extras = S.extras.length ? `<section class="aisle"><h2 class="aisle-h">Your extras <span>${S.extras.length}</span></h2><ul>${S.extras.map((x) => `<li class="li${x.done ? ' done' : ''}"><label for="ex-${x.id}"><input type="checkbox" class="check" id="ex-${x.id}" data-act="ex-check" data-id="${x.id}"${x.done ? ' checked' : ''}><span class="li-main">${esc(x.text)}</span><button type="button" class="btn-icon del" data-act="ex-del" data-id="${x.id}" aria-label="Remove ${esc(x.text)}">${ic('x')}</button></label></li>`).join('')}</ul></section>` : '';
    const groups = v.groups.map((g) => `<section class="aisle"><h2 class="aisle-h">${g.label} <span>${g.rows.length}</span></h2><ul>${g.rows.map(liHTML).join('')}</ul></section>`).join('');
    const pantry = v.pantry.length ? `<details class="pantry"><summary>Check the pantry (${v.pantry.length} basics)</summary><p class="muted" style="font-size:14px;margin-bottom:6px">You probably have these. Tick off the ones you do so you don't buy doubles.</p><ul>${v.pantry.map(liHTML).join('')}</ul></details>` : '';
    const nice = v.nice.length ? `<details class="pantry"><summary>Nice to have (${v.nice.length} optional)</summary><p class="muted" style="font-size:14px;margin-bottom:6px">Garnishes and extras the recipes can do without. Skip them to save money.</p><ul>${v.nice.map(liHTML).join('')}</ul></details>` : '';
    const also = S.extraRecipes.length ? `<section class="also"><h2 class="sec-h">Also shopping for</h2><div class="chips">${S.extraRecipes.map((x) => { const r = R.get(x.id); return r ? `<button type="button" class="chip" data-act="also-remove" data-id="${x.id}" aria-label="Remove ${esc(r.n)} from the list">${esc(r.n)} ${ic('x')}</button>` : ''; }).join('')}</div></section>` : '';
    const empty = !v.total && !v.pantry.length && !v.nice.length;
    const note = Sync.on ? '<p class="sync-note on"><span class="dot"></span>Saved to your Claude account. Your plan and list follow you to any device where you open this page.</p>'
      : storage === 'blocked' ? "<p class=\"sync-note\"><span class=\"dot\"></span>This browser is blocking storage, so changes won't be kept after you close the page.</p>"
        : '<p class="sync-note"><span class="dot"></span>Saved in this browser on this device.</p>';
    patch($('#s-list'), `<div class="wrap">
      <header class="scr-head"><div><h1>Grocery list</h1><p>${n ? `For ${n} ${plural(n, 'dinner', 'dinners')}, ${range}, cooking for ${S.servings}.` : 'Nothing planned this week yet.'}${S.extraRecipes.length ? ` Plus ${S.extraRecipes.length} more ${plural(S.extraRecipes.length, 'recipe', 'recipes')}.` : ''}</p></div>
        <div class="list-acts"><button type="button" class="btn btn-line sm" data-act="list-copy"${empty ? ' disabled' : ''}>${ic('copy')} Copy list</button><button type="button" class="btn btn-quiet" data-act="list-uncheck"${v.done ? '' : ' disabled'}>Uncheck all</button></div>
      </header>
      ${v.total ? `<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${v.total}" aria-valuenow="${v.done}" aria-label="Items checked"><span style="width:${pct}%"></span></div><p class="progress-l">${v.done} of ${v.total} checked off</p>` : ''}
      <form class="add-item" data-form="add-item"><label class="vh" for="add-item-input">Add an item</label><input id="add-item-input" placeholder="Add something else, like paper towels" maxlength="120" autocomplete="off"><button type="submit" class="btn btn-primary">${ic('plus')} Add</button></form>
      ${empty ? `<div class="empty" style="margin-top:14px"><b>Your list builds itself.</b> Plan a few dinners on the Week tab and the groceries show up here, sorted by aisle. <button type="button" class="btn-quiet" data-act="tab" data-tab="week">Plan the week</button></div>` : ''}
      <div class="list-cols">${extras}${groups}${pantry}${nice}</div>
      ${also}
      ${note}
    </div>`);
  }

  /* =========================================================
     Screen: Recipes
     ========================================================= */
  function rxCard(r) {
    return `<article class="rx"><button type="button" class="rx-open" data-act="open-recipe" data-id="${r.id}">
      <span class="rx-top"><span class="ptag p-${r.p}">${P_NAME[r.p]}</span>${priceTag(r)}${r.ai ? '<span class="ai-badge">Chef made</span>' : ''}</span>
      <span class="rx-name">${esc(r.n)}</span>
      ${r.b ? `<span class="rx-blurb">${esc(r.b)}</span>` : ''}
      <span class="rx-meta">${ic('clock')} ${fmtTime(r.t)} · ${effortWord(r)}</span>
    </button>${favBtn(r, 'fav')}</article>`;
  }
  function renderRecipes() {
    const cb = cookbookList();
    const filters = [['all', 'All'], ['saved', `Saved${S.favs.length ? ' (' + S.favs.filter((id) => R.has(id)).length + ')' : ''}`]]
      .concat(cb.length ? [['cookbook', `Chef made (${cb.length})`]] : [])
      .concat([['under2', 'Under $2.50'], ['quick', '30 min or less'], ['slow', 'Slow cooker']])
      .concat(PROTEINS);
    if (UI.rxFilter === 'cookbook' && !cb.length) UI.rxFilter = 'all';
    let list = BUILTIN.concat(cb);
    const f = UI.rxFilter;
    if (f === 'saved') list = list.filter((r) => S.favs.includes(r.id));
    else if (f === 'cookbook') list = cb;
    else if (f === 'under2') list = list.filter((r) => r.cps && r.cps < 2.5);
    else if (f === 'quick') list = list.filter((r) => r.t <= 30);
    else if (f === 'slow') list = list.filter((r) => r.tags.includes('slow'));
    else if (P_NAME[f]) list = list.filter((r) => r.p === f);
    const q = UI.rxQ.trim().toLowerCase();
    if (q) { const words = q.split(/\s+/).filter(Boolean); list = list.filter((r) => words.every((w) => r.hay.includes(w))); }
    const s = UI.rxSort;
    list = list.slice().sort((a, b) => (s === 'quick' ? a.t - b.t || (a.cps || 9) - (b.cps || 9) : s === 'az' ? a.n.localeCompare(b.n) : (a.cps || 99) - (b.cps || 99) || a.t - b.t));
    const empty = f === 'saved' && !q ? '<div class="empty"><b>Nothing saved yet.</b> Tap the heart on any recipe to keep it here.</div>' : `<div class="empty"><b>No recipes match.</b> Try a different word or filter.</div>`;
    patch($('#s-recipes'), `<div class="wrap">
      <header class="scr-head"><div><h1>Recipes</h1><p>${BUILTIN.length} cheap, easy weeknight dinners. Every one is worth making again.</p></div></header>
      <div class="rx-tools">
        <div class="searchbox">${ic('search')}<label class="vh" for="rx-q">Search recipes</label><input id="rx-q" type="search" placeholder="Search recipes" autocomplete="off" value="${esc(UI.rxQ)}"></div>
        <div class="rx-sort"><label for="rx-sort">Sort</label><select id="rx-sort"><option value="cheap"${s === 'cheap' ? ' selected' : ''}>Cheapest</option><option value="quick"${s === 'quick' ? ' selected' : ''}>Quickest</option><option value="az"${s === 'az' ? ' selected' : ''}>A to Z</option></select></div>
      </div>
      <div class="chip-row" role="radiogroup" aria-label="Show">${filters.map(([k, l]) => `<button type="button" class="chip" role="radio" id="rf-${k}" aria-checked="${UI.rxFilter === k}" data-act="rx-filter" data-v="${k}">${esc(l)}</button>`).join('')}</div>
      <p class="rx-count" aria-live="polite">${list.length} ${plural(list.length, 'recipe', 'recipes')}</p>
      ${list.length ? `<div class="rx-grid">${list.map(rxCard).join('')}</div>` : empty}
    </div>`);
  }

  /* =========================================================
     Sheets: recipe, day picker, ask the chef, copy fallback
     ========================================================= */
  const closeBtn = () => `<button type="button" class="btn-icon" data-act="sheet-close" aria-label="Close">${ic('x')}</button>`;
  function openSheet(state) {
    if (!UI.sheet) UI.lastFocus = document.activeElement;
    UI.sheet = state;
    $('#sheet').hidden = false;
    document.documentElement.classList.add('locked');
    renderSheet();
    const p = $('.sheet-panel');
    p.scrollTop = 0;
    requestAnimationFrame(() => { try { p.focus({ preventScroll: true }); } catch (e) { /* ignore */ } });
  }
  function closeSheet() {
    if (!UI.sheet) return;
    if (UI.ask.ctl) { try { UI.ask.ctl.abort(); } catch (e) { /* ignore */ } }
    UI.sheet = null;
    $('#sheet').hidden = true;
    if (!UI.cook) document.documentElement.classList.remove('locked');
    const lf = UI.lastFocus;
    UI.lastFocus = null;
    if (lf && document.contains(lf)) { try { lf.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
  }

  /* =========================================================

  let wakeLock = null;
  async function requestWake() {

  function startCook() {
    const s = UI.sheet;

      <div class="ck-main" aria-live="polite">
        <p class="ck-stepno">Step ${c.step + 1} of ${n}</p>

  /* =========================================================
     Timers
     ========================================================= */
  const TIMERS = [];
  let tickHandle = null;
  let audioCtx = null;
  let timerSig = '';
  function ensureAudio() {
    try {
      if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) { audioCtx = null; }
  }
  function beep() {
    if (!audioCtx) return;
    try {
      const t0 = audioCtx.currentTime + 0.02;
      for (let i = 0; i < 3; i++) {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        const s = t0 + i * 0.3;
        o.type = 'sine';
        o.frequency.value = i === 2 ? 1175 : 880;
        g.gain.setValueAtTime(0.0001, s);
        g.gain.exponentialRampToValueAtTime(0.3, s + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, s + 0.22);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start(s);
        o.stop(s + 0.25);
      }
    } catch (e) { /* sound is a bonus */ }
  }
  function startTimer(min, label) {
    ensureAudio();
    const ms = min * 60000;
    TIMERS.push({ id: uid(), label, end: Date.now() + ms, left: ms, paused: false, ding: false, rings: 0, next: 0 });
    while (TIMERS.length > 5) TIMERS.shift();
    if (!tickHandle) tickHandle = setInterval(tick, 250);
    renderTimers();
    toast(`${min}-minute timer started. I'll beep when it's done.`);
  }
  function tick() {
    const now = Date.now();
    let live = false;
    for (const t of TIMERS) {
      if (t.paused) continue;
      if (!t.ding) {
        t.left = Math.max(0, t.end - now);
        if (t.left <= 0) { t.ding = true; t.next = now; }
        else live = true;
      }
      if (t.ding) {
        live = true;
        if (now >= t.next && t.rings < 12) {
          beep();
          try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) { /* ignore */ }
          t.rings++;
          t.next = now + 5000;
        }
      }
    }
    renderTimers();
    if (!live) { clearInterval(tickHandle); tickHandle = null; }
  }
  const fmtClock = (ms) => { const s = Math.ceil(ms / 1000); return `${Math.floor(s / 60)}:${pad2(s % 60)}`; };
  function renderTimers() {
    const host = $('#timers');
    document.documentElement.classList.toggle('has-timers', TIMERS.length > 0);
    const sig = TIMERS.map((t) => `${t.id}:${t.ding ? 1 : 0}${t.paused ? 1 : 0}`).join('|');
    if (sig === timerSig && host.children.length === TIMERS.length) {
      TIMERS.forEach((t, i) => { const el = host.children[i] && host.children[i].querySelector('.tm-time'); if (el) { const txt = t.ding ? 'Done' : fmtClock(t.left); if (el.textContent !== txt) el.textContent = txt; } });
      return;
    }
    timerSig = sig;
    host.innerHTML = TIMERS.map((t) => `<div class="tm${t.ding ? ' ding' : ''}${t.paused ? ' paused' : ''}" role="timer" aria-label="${esc(t.label)}"><span class="tm-time num">${t.ding ? 'Done' : fmtClock(t.left)}</span><span class="tm-label">${esc(t.label)}</span>${t.ding ? '' : `<button type="button" class="btn-icon" data-act="tm-pause" data-t="${t.id}" aria-label="${t.paused ? 'Resume' : 'Pause'} timer">${ic(t.paused ? 'play' : 'pause')}</button>`}<button type="button" class="btn-icon" data-act="tm-x" data-t="${t.id}" aria-label="${t.ding ? 'Dismiss' : 'Cancel'} timer">${ic(t.ding ? 'check' : 'x')}</button></div>`).join('');
  }

  /* =========================================================
     Toasts
     ========================================================= */
  function toast(msg, action) {
    const host = $('#toasts');
    const el = document.createElement('div');
    el.className = 'toast';
    el.setAttribute('role', 'status');
    const span = document.createElement('span');
    span.textContent = msg;
    el.appendChild(span);
    if (action) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'toast-btn';
      b.textContent = action.label;
      b.addEventListener('click', () => { action.run(); el.remove(); });
      el.appendChild(b);
    }
    host.appendChild(el);
    while (host.children.length > 3) host.removeChild(host.firstChild);
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 320); }, action ? 6000 : 3400);
  }

  function buildRecipePrompt(text, time, servings, extras) {
    const ex = ASK_EXTRAS.filter(([k]) => extras.includes(k)).map((x) => x[2]);
    return [
      'You are a friendly, experienced home cook. Write one dinner recipe for an everyday home cook in the United States. It should be cheap, easy and genuinely delicious.',

      ex.length ? `- Make it ${ex.join('; ')}.` : null,
      '- Build it around what they have. Add at most 3 ingredients they would need to buy, and only if they really matter.',
      `- Assume a normal pantry: ${PANTRY_TEXT}.`,

  window.addEventListener('storage', (e) => {
    if (e.key !== LS_KEY || !e.newValue) return;
    try { const o = sanitize(JSON.parse(e.newValue)); if (o.updatedAt > S.updatedAt) { S = o; syncCookbookRegistry(); renderAll(); } } catch (err) { /* ignore */ }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (UI.cook && !wakeLock) requestWake();
    renderAll();
  });
  window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (SCREENS.includes(t) && t !== UI.tab) setTab(t); });

  /* =========================================================
     Boot
     ========================================================= */
  function boot() {
    syncCookbookRegistry();
    const h = (location.hash || '').slice(1);
    UI.tab = SCREENS.includes(h) ? h : 'tonight';
    for (const s of SCREENS) $('#s-' + s).hidden = s !== UI.tab;
    renderAll();
    initSync();
    initAI();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
